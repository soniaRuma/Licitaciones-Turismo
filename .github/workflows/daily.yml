name: Actualización diaria de licitaciones de Turismo

on:
  schedule:
    # Objetivo: todos los días a las 07:00 y a las 15:00 hora de España.
    # (07/10/2026) PLACSP actualiza sus datos abiertos UNA VEZ AL DÍA, de
    # madrugada, con lo publicado el día anterior: la de las 07:00 lo recoge
    # para tenerlo al empezar la jornada, y la de las 15:00 queda como red de
    # seguridad (por si GitHub falla por la mañana o PLACSP publica más tarde).
    # GitHub Actions solo entiende UTC y España cambia de hora dos veces al año,
    # así que programamos DOS horarios por cada hora deseada y el job
    # "comprobar_hora" deja pasar solo el que toca según la época del año:
    #   07:00 España = 05:00 UTC en verano (CEST, UTC+2) / 06:00 UTC en invierno (CET, UTC+1)
    #   15:00 España = 13:00 UTC en verano               / 14:00 UTC en invierno
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:      # permite lanzarlo manualmente desde la pestaña "Actions" de GitHub (siempre se ejecuta)
    inputs:
      meses_historico:
        description: "Carga histórica: nº de meses a recuperar (0 = ejecución normal, solo novedades)"
        required: false
        default: "0"

jobs:
  comprobar_hora:
    runs-on: ubuntu-24.04   # versión fija: evita cambios inesperados cuando GitHub mueva "ubuntu-latest" a Ubuntu 26 (19/10/2026)
    outputs:
      ejecutar: ${{ steps.hora.outputs.ejecutar }}
    steps:
      - name: Comprobar si toca ejecutar (07:00 o 15:00 en España)
        id: hora
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lanzamiento manual: se ejecuta siempre."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OFFSET=$(TZ=Europe/Madrid date +%z)   # +0200 en verano, +0100 en invierno
          PROGRAMACION="${{ github.event.schedule }}"
          if { { [ "$PROGRAMACION" = "0 13 * * *" ] || [ "$PROGRAMACION" = "0 5 * * *" ]; } && [ "$OFFSET" = "+0200" ]; } || \
             { { [ "$PROGRAMACION" = "0 14 * * *" ] || [ "$PROGRAMACION" = "0 6 * * *" ]; } && [ "$OFFSET" = "+0100" ]; }; then
            echo "Es una de las horas programadas en España (07:00 o 15:00, offset $OFFSET): se ejecuta."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Esta programación ($PROGRAMACION) no corresponde a las 07:00 ni a las 15:00 españolas con offset $OFFSET: se omite."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

  actualizar:
    needs: comprobar_hora
    if: needs.comprobar_hora.outputs.ejecutar == 'true'
    runs-on: ubuntu-24.04   # versión fija: evita cambios inesperados cuando GitHub mueva "ubuntu-latest" a Ubuntu 26 (19/10/2026)
    # Si algo se queda colgado (p.ej. el servidor de Hacienda no responde),
    # se corta a los 150 minutos en vez de esperar las 6 horas por defecto de GitHub.
    timeout-minutes: 150   # la carga histórica puede tardar; un día normal debería quedarse en pocos minutos
    env:
      # 0 en las ejecuciones programadas; el número elegido al lanzarlo a mano.
      MESES_HISTORICO: ${{ inputs.meses_historico || '0' }}
      # Muestra los mensajes del script en el log EN DIRECTO. Sin esto, Python
      # los guarda y solo aparecen al final, y no se puede ver en qué paso va.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v6        # v6 usa Node.js 24 (Node.js 20 está obsoleto)

      - name: Preparar Python
        uses: actions/setup-python@v6    # v6 usa Node.js 24
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar la ingesta de licitaciones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest_placsp.py
      - name: Ejecutar la ingesta de Cataluña (Capa 2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest_capa2.py
